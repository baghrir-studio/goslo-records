# Builds the app on a GitHub Mac and uploads it to TestFlight.
# Runs by hand (Actions › TestFlight › Run workflow) and on every push to main.
# Needs three repository secrets (see docs/testflight-auto.md); without them it stops at the first step, in green.
name: TestFlight

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: testflight
  cancel-in-progress: true

jobs:
  upload:
    name: Build et envoi TestFlight
    runs-on: macos-15
    timeout-minutes: 45
    env:
      TEAM_ID: WG264QRT9M
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Clé App Store Connect présente ?
        id: key
        run: |
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "Secrets ASC_KEY_ID / ASC_ISSUER_ID / ASC_KEY_P8 absents : pas d'envoi (voir docs/testflight-auto.md)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'

      - name: Xcode le plus récent
        if: steps.key.outputs.ready == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Clé API
        if: steps.key.outputs.ready == 'true'
        run: |
          mkdir -p "$RUNNER_TEMP/keys"
          printf '%s' "$ASC_KEY_P8" > "$RUNNER_TEMP/keys/AuthKey.p8"
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>teamID</key><string>$TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
          </dict></plist>
          PLIST

      - name: Archive
        if: steps.key.outputs.ready == 'true'
        run: |
          BUILD=$(date -u +%Y%m%d%H%M)
          echo "Build $BUILD"
          xcodebuild -project GosloRecords/GosloRecords.xcodeproj -scheme GosloRecords \
            -configuration Release -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/GosloRecords.xcarchive" \
            CURRENT_PROJECT_VERSION=$BUILD DEVELOPMENT_TEAM=$TEAM_ID \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            archive | tail -n 40

      - name: Envoi vers TestFlight
        if: steps.key.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive -archivePath "$RUNNER_TEMP/GosloRecords.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" | tail -n 20

      - name: Nettoyage
        if: always()
        run: rm -rf "$RUNNER_TEMP/keys"
